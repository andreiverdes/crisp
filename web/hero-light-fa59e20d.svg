<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="CRISP: say the useful thing once, then stop. 47% fewer tokens, 21 of 30 blind pairings won, 97% of required facts kept.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969da" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="420" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="420" fill="#ffffff"/>
    <rect width="1200" height="420" fill="url(#g)"/>
    <rect x=".5" y=".5" width="1199" height="419" rx="16" fill="none" stroke="#d0d7de"/>

    <!-- left: wordmark -->
    <text x="64" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="-2.5" fill="#1f2328">CRISP</text>
    <text x="64" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.2" fill="#59636e">CONCISE · RELEVANT · INTUITIVE · SIMPLE · PROTOCOL</text>
    <text x="64" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#1f2328">Say the useful thing once,</text>
    <text x="64" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#1f2328">as clearly as possible, then stop.</text>
    <text x="64" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">A writing protocol for humans and LLMs. One engineer talking to another.</text>
    <text x="64" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">Works as a system prompt, a slash command, or a verb: “crispify this.”</text>

    <line x1="64" y1="300" x2="640" y2="300" stroke="#d0d7de"/>
    <text x="64" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="-0.5" fill="#1a7f37">−47%</text><text x="64" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">tokens vs baseline</text><text x="214" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="-0.5" fill="#0969da">21/30</text><text x="214" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">blind pairings won</text><text x="364" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="-0.5" fill="#1f2328">97%</text><text x="364" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">required facts kept</text><text x="514" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="650" letter-spacing="-0.5" fill="#1a7f37">−30%</text><text x="514" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e">tokens vs ASD-STE100</text>

    <!-- right: install terminal -->
    <rect x="676" y="52" width="460" height="316" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="700" cy="76" r="5" fill="#cf222e" opacity=".9"/><circle cx="718" cy="76" r="5" fill="#d29922" opacity=".9"/><circle cx="736" cy="76" r="5" fill="#1a7f37" opacity=".9"/>
    <text x="906" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8c959f">Claude Code</text>
    <line x1="676" y1="96" x2="1136" y2="96" stroke="#d0d7de"/>

    <text x="700" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="1.4" fill="#59636e">INSTALL</text>
    <text x="700" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328"><tspan fill="#1a7f37">$</tspan> claude plugins marketplace add \</text>
    <text x="716" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">andreiverdes/awesome-claude</text>
    <text x="700" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328"><tspan fill="#1a7f37">$</tspan> claude plugins install awesome-claude@awesome-claude</text>

    <text x="700" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="1.4" fill="#59636e">USE</text>
    <text x="700" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328"><tspan fill="#0969da">&gt;</tspan> /crisp</text>
    <text x="700" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328"><tspan fill="#0969da">&gt;</tspan> crispify this</text>
    <text x="700" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328"><tspan fill="#0969da">&gt;</tspan> make this crispier</text>

    <text x="700" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="1.4" fill="#59636e">OR IN ANY PROJECT</text>
    <text x="700" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328"><tspan fill="#1a7f37">$</tspan> python3 skills/crisp/scripts/install.py --command</text>

    <text x="1136" y="396" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8c959f">crisp-bench/v1 · Claude Sonnet 5.5 · 10 prompts × 3 samples · blind-judged</text>
  </g>
</svg>
