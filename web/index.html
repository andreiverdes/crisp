<script>
(() => {

496 30 98 35 449 6 535 -9 28 -19 65 -23 84 -22 105 -129 297 -234 419 -136 158 -298 257 -571 348 -53 18 -250 19 -6275 20 -3421 1 -6233 -1 -6250 -3z M10800 10053 c-151 -8 -252 -39 -435 -131 -152 -76 -326 -237 -399 -367 -9 -16 -28 -50 -42 -75 -15 -25 -30 -61 -36 -80 -5 -19 -15 -48 -23 -65 -52 -117 -57 -369 -10 -600 37 -185 210 -419 405 -549 138 -92 187 -114 355 -159 l80 -21 3565 -3 c3516 -3 3567 -2 3675 17 250 45 454 162 607 348 64 77 128 167 128 180 0 4 7 21 16 37 15 27 37 94 65 195 15 58 22 318 10 401 -11 80 -57 235 -72 245 -5 3 -9 12 -9 20 0 25 -79 154 -143 232 -132 163 -377 311 -592 359 -76 16 -267 17 -3590 18 -1930 0 -3530 -1 -3555 -2z M13530 6953 c-53 -8 -206 -44 -235 -55 -394 -146 -660 -465 -721 -863 -61 -403 88 -784 405 -1035 77 -61 227 -150 254 -150 7 0 25 -7 41 -15 26 -14 92 -31 217 -56 27 -6 532 -8 1235 -6 1313 3 1225 -1 1414 65 258 90 526 355 622 617 60 162 71 231 72 425 1 215 -11 268 -112 475 -141 292 -418 507 -752 581 l-105 23 -1155 -1 c-635 0 -1166 -3 -1180 -5z\"/> </g>" } });

  function Hero() {
    return h("header", { className: "hero" },

        h("div", null,
          h("h1", { className: "text-hz-fg" }, "Say the useful thing once,", h("br"), "then ", h("em", null, "stop"), "."),
          h("p", { className: "lede text-hz-fg-muted" }, "CRISP is a writing protocol for humans and LLMs. Ten checkable rules that turn a chatty model into a competent engineer talking to another one. Works as a slash command, a system prompt, or a verb: “crispify this.”"),
          h("div", { className: "cta" },

            h("a", { href: "benchmark/" }, h(Button, { variant: "secondary", size: "lg", leading: h(Icons.BarChart) }, "See the benchmark")),
            h("a", { href: GH }, h(Button, { variant: "ghost", size: "lg", leading: h(Icons.GitBranch) }, "GitHub")))),
        h(Terminal, { cwd: "~/api", prompt: "❯", tabs: ["claude"], lines: [

          { text: "" },
          { text: "why does my nightly job take 40 min after the pg16 upgrade?", prompt: true },

          { text: "Start with planner statistics: pg_upgrade doesn't carry them" },

  }

  function What() {
    const card = (icon, title, items) => h(Card, { title: h("span", { className: "flex items-center gap-2" }, h(icon, { size: 18, className: "text-hz-accent-fg" }), title), description: null },
      h("ul", { className: "text-hz-sm text-hz-fg-muted", style: { margin: 0, padding: 0, listStyle: "none" } }, ...items.map((t, i) => h("li", { key: i, className: i ? "hz-hairline-t" : "", style: { padding: "7px 0" } }, t))));

      Kicker("What it is"),
      h("h2", null, "Five words, ten rules, one pass."),
      Sub("CRISP stands for Concise, Relevant, Intuitive, Simple, Protocol. It is a protocol because every rule has a yes/no check, so a human or a model can tell whether a piece of writing complies."),
      h("div", { className: "g3" },
        card(Icons.List, "Stops the blabbering", ["No “Great question”, “Here’s a breakdown”, “I hope this helps”", "No restated question, no preview, no closing summary", "Every sentence changes what the reader knows, does, or decides"]),

            Pre([h("span", { className: "del" }, "Great question! Infinite re-render loops are a common issue that many React developers encounter, and there are a number of potential causes. Let's break this down.\n\nPossible causes: missing dependency array · state updates inside the effect · unstable dependencies …\nRecommended fixes: add a dependency array · memoize with useMemo and useCallback · don't mutate state directly …\n\nIt's also worth noting that you should always consider adding cleanup functions. I hope this helps! If you share your code, I'd be happy to take a closer look.")], "text-hz-fg-subtle")),
          h(Card, { title: h("span", { className: "flex items-center gap-2" }, h(Badge, { tone: "success", variant: "soft", size: "sm" }, "CRISP"), h("span", { className: "mono text-hz-xs text-hz-fg-subtle" }, "80 words · −48%")), description: null, padding: "sm" },

  }

  const RULES = [["Answer first", "The first sentence is the answer, decision, result, or ask."], ["Say it once", "No preview, recap, restated question, or restated shared context."], ["Keep what changes action", "Delete any sentence whose removal breaks nothing."], ["Plain words, same words", "Common verbs; one term per concept, reused exactly; no intensifiers without a measurement."], ["Name the actor, state the condition", "“If X, do Y.” “X failed because Y.”"], ["Replace vague with checkable", "Soon, appropriate, usually, etc. become a number, a name, a condition, or “unknown”."], ["Structure is earned", "Prose by default; numbers for sequence, bullets for parallel items, tables for shared attributes, headings only at real topic boundaries."], ["Short is not cryptic", "Keep code, corrections of wrong premises, risks, real uncertainty. No telegraphese."], ["Sound like a colleague", "Contractions fine; no flattery, ceremony, apology, moralizing, or ritual hedges. Disagree plainly."], ["Stop", "No closing summary, no “let me know”."]];

  }

  function App() {
    const [theme, setTheme] = R.useState(localStorage.getItem("crisp-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
    R.useEffect(() => localStorage.setItem("crisp-theme", theme), [theme]);
    return h(HorizonProvider, { theme },
      h("div", { className: "bg-hz-canvas text-hz-fg font-hz-sans", style: { minHeight: "100vh" } },
        h(Nav, { theme, setTheme }), h(Hero), h(What), h(BeforeAfter), h(Rules), h(Levels), h(Install), h(Bench), h(Final), h(Footer)));
  }
  RD.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
