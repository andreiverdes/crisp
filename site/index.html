<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"%3E%0A  %3Cstyle%3E.b{stroke:#0d1f3a;fill:#0d1f3a}%40media (prefers-color-scheme:dark){.b{stroke:#eeeef0;fill:#eeeef0}}%3C/style%3E%0A  %3Cpath class="b" d="M38 10.5H23C15.5 10.5 10.5 15.5 10.5 23V36C10.5 42.5 14.6 46.6 20 47.2" fill="none" stroke-width="8" stroke-linecap="round"/%3E%0A  %3Cpath class="b" d="M13.5 43.5V56.2C13.5 57.4 14.8 58 15.7 57.3L26.8 48.6H31.5L24.4 41.7H16.5Z" stroke="none"/%3E%0A  %3Cpath d="M28 25H51M32 34H46M37 42.5H41" stroke="#0a7cf6" stroke-width="6.5" stroke-linecap="round"/%3E%0A%3C/svg%3E">
<title>CRISP benchmark</title>
<link rel="stylesheet" href="vendor/horizon.css">
<style>
  html, body { margin: 0; min-height: 100%; }
  .page { max-width: 1240px; margin: 0 auto; padding: 24px 24px 96px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  @media (max-width: 960px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } .span2 { grid-column: auto; } }
  .panel { padding: 20px 22px; }
  .panel h3 { font-size: 15px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.005em; }
  .panel .desc { font-size: 12.5px; margin: 0 0 14px; }
  .big { display: flex; gap: 28px; align-items: baseline; flex-wrap: wrap; margin: 4px 0 14px; }
  .big b { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .big span { font-size: 12.5px; margin-left: 6px; }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { font-family: var(--font-hz-sans); }
  .chart .mono { font-family: var(--font-hz-mono); font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; margin-top: 10px; justify-content: center; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--sw); }
  .donut { display: flex; gap: 24px; align-items: center; }
  .donut table { font-size: 13px; border-collapse: collapse; }
  .donut td { padding: 4px 10px 4px 0; white-space: nowrap; }
  .donut td.n { font-family: var(--font-hz-mono); text-align: right; font-variant-numeric: tabular-nums; }
  .donut td i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
  .pre { white-space: pre-wrap; font-family: var(--font-hz-mono); font-size: 12px; line-height: 1.55; max-height: 460px; overflow: auto; padding: 12px; }
  .kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .hero h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 6px; line-height: 1.1; }
  .verdict { font-size: 15px; line-height: 1.5; max-width: 820px; }
  .why li { margin: 6px 0; }
  .why { padding-left: 18px; margin: 0; font-size: 13.5px; line-height: 1.5; }
  .why b { font-weight: 600; }
  .data-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .sample-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.js"></script>
<script src="vendor/horizon.js"></script>
<script>
(async () => {
  const root = document.getElementById("root");
  window.addEventListener("error", (e) => { root.innerHTML = `<pre style="padding:24px;color:#b00;font:13px monospace;white-space:pre-wrap">Render failed: ${e.message}\n${e.filename}:${e.lineno}</pre>`; });
  const inline = document.getElementById("crisp-data");
  const data = inline ? JSON.parse(inline.textContent) : await (await fetch("data.json")).json();
  const H = window.HorizonUI, R = window.React, RD = window.ReactDOM, h = R.createElement;
  const Logo = ({ size = 22 }) => h("svg", { viewBox: "0 0 64 64", width: size, height: size, fill: "none", "aria-hidden": true },
    h("path", { d: "M38 10.5H23C15.5 10.5 10.5 15.5 10.5 23V36C10.5 42.5 14.6 46.6 20 47.2", stroke: "currentColor", strokeWidth: 8, strokeLinecap: "round" }),
    h("path", { d: "M13.5 43.5V56.2C13.5 57.4 14.8 58 15.7 57.3L26.8 48.6H31.5L24.4 41.7H16.5Z", fill: "currentColor" }),
    h("path", { d: "M28 25H51M32 34H46M37 42.5H41", stroke: "#0a7cf6", strokeWidth: 6.5, strokeLinecap: "round" }));
  const { HorizonProvider, Card, Badge, Tabs, TabPanel, SegmentedControl, InlineAlert, Icons, Select, Accordion } = H;

  // ---------- data ----------
  const L = { sonnet: data.lanes[0], sonnetV2: data.lanes[1], ant: data.lanes[2], oai: data.lanes[3] };
  const FIX = ["s1a","s1b","s2a","s2b","s3a","s3b","s4a","s4b","s5a","s5b"];
  const SCEN = { s1: "Technical Q&A", s2: "Debugging", s3: "Spec / plan", s4: "Status update", s5: "Comparison" };
  const DIMS = ["correctness","clarity","ambiguity","scanability","relevance","conversational","completeness"];
  const C = { base: "var(--color-hz-cat-8)", crisp: "var(--color-hz-cat-1)", crispify: "var(--color-hz-cat-7)", ste: "var(--color-hz-cat-3)",
              ant: "var(--color-hz-cat-1)", oai: "var(--color-hz-cat-4)", win: "var(--color-hz-cat-6)", tie: "var(--color-hz-cat-8)", loss: "var(--color-hz-cat-3)",
              saved: "var(--color-hz-cat-6)", kept: "var(--color-hz-cat-1)" };
  const pct = (n, d = 0) => `${n < 0 ? "−" : "+"}${Math.abs(n).toFixed(d)}%`;
  const fmt = (n) => n >= 1000 ? `${(n / 1000).toFixed(1)}k` : `${n}`;
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const h2h = data.headtohead;

  // ---------- primitives ----------
  const Panel = ({ title, desc, children, className = "", style }) => h(Card, { title: null, description: null, padding: "none", className, style },
    h("div", { className: "panel" }, title ? h("h3", null, title) : null, desc ? h("p", { className: "desc text-hz-fg-muted" }, desc) : null, children));
  const Big = (items) => h("div", { className: "big" }, ...items.map(([v, label, color]) => h("div", null, h("b", { style: color ? { color } : null }, v), h("span", { className: "text-hz-fg-muted" }, label))));
  const Legend = (items) => h("div", { className: "legend text-hz-fg-muted" }, ...items.map(([label, color]) => h("span", { style: { "--sw": color } }, label)));
  const txt = (x, y, s, o = {}) => h("text", { x, y, fontSize: o.size || 11.5, fill: o.fill || "var(--color-hz-fg-muted)", textAnchor: o.anchor || "start", className: o.mono ? "mono" : "", fontWeight: o.weight || 400, dominantBaseline: o.base || "middle" }, s);
  const Svg = (w, hh, kids) => h("svg", { viewBox: `0 0 ${w} ${hh}`, className: "chart", role: "img" }, ...kids);

  function Donut({ parts, size = 150, stroke = 26, center }) {
    const total = sum(parts.map(p => p.v)); const r = (size - stroke) / 2, c = 2 * Math.PI * r; let off = 0;
    const arcs = parts.map((p, i) => { const len = c * p.v / total; const el = h("circle", { key: i, cx: size / 2, cy: size / 2, r, fill: "none", stroke: p.color, strokeWidth: stroke, strokeDasharray: `${len} ${c - len}`, strokeDashoffset: -off, transform: `rotate(-90 ${size / 2} ${size / 2})` }); off += len; return el; });
    return h("div", { className: "donut" },
      h("svg", { width: size, height: size, viewBox: `0 0 ${size} ${size}`, style: { flex: "none" } }, ...arcs, center ? txt(size / 2, size / 2, center, { anchor: "middle", size: 18, weight: 600, fill: "var(--color-hz-fg)" }) : null),
      h("table", null, h("tbody", null, ...parts.map((p, i) => h("tr", { key: i }, h("td", null, h("i", { style: { background: p.color } }), p.label), h("td", { className: "n" }, p.text ?? fmt(p.v)), h("td", { className: "n text-hz-fg-muted" }, `${(100 * p.v / total).toFixed(1)}%`))))));
  }

  // vertical grouped bars: cats=[{label}], series=[{name,color,values[]}]
  function Bars({ cats, series, W = 560, Hh = 220, unit = "", ymax }) {
    const padL = 44, padB = 34, padT = 12, innerW = W - padL - 12, innerH = Hh - padT - padB;
    const max = ymax || Math.max(...series.flatMap(s => s.values)) * 1.15;
    const gw = innerW / cats.length, bw = Math.min(26, (gw * 0.7) / series.length);
    const Y = (v) => padT + innerH - (v / max) * innerH;
    const kids = [];
    const ticks = 4; for (let i = 0; i <= ticks; i++) { const v = max * i / ticks, y = Y(v); kids.push(h("line", { x1: padL, x2: W - 12, y1: y, y2: y, stroke: "var(--color-hz-line-soft)" })); kids.push(txt(padL - 8, y, fmt(Math.round(v)) + unit, { anchor: "end", mono: true, size: 10.5 })); }
    cats.forEach((cat, ci) => {
      const x0 = padL + ci * gw + (gw - bw * series.length) / 2;
      series.forEach((s, si) => { const v = s.values[ci]; kids.push(h("rect", { x: x0 + si * bw, y: Y(v), width: bw - 2, height: Math.max(1, Y(0) - Y(v)), fill: s.color, rx: 2 })); });
      kids.push(txt(padL + ci * gw + gw / 2, Hh - padB + 14, cat.label, { anchor: "middle", size: 10.5 }));
      if (cat.sub) kids.push(txt(padL + ci * gw + gw / 2, Hh - padB + 26, cat.sub, { anchor: "middle", size: 9.5, fill: "var(--color-hz-fg-subtle)" }));
    });
    return Svg(W, Hh, kids);
  }

  // dumbbell per dim: series=[{name,color,from[],to[]}]
  function Dumbbell({ series, W = 560, lo = 3.6, hi = 5.05, labelW = 110 }) {
    const rowH = 28, x0 = labelW, x1 = W - 14, X = (v) => x0 + (v - lo) / (hi - lo) * (x1 - x0), kids = [];
    [3.75, 4, 4.25, 4.5, 4.75, 5].forEach(g => { kids.push(h("line", { x1: X(g), x2: X(g), y1: 0, y2: DIMS.length * rowH, stroke: "var(--color-hz-line-soft)" })); kids.push(txt(X(g), DIMS.length * rowH + 11, g.toFixed(2), { anchor: "middle", size: 10, mono: true })); });
    DIMS.forEach((d, i) => { const y = i * rowH + rowH / 2; kids.push(txt(0, y, d, { fill: "var(--color-hz-fg)", weight: 500 }));
      series.forEach((s, k) => { const dy = series.length > 1 ? (k ? 5 : -5) : 0, a = s.from[i], b = s.to[i];
        kids.push(h("line", { x1: X(a), x2: X(b), y1: y + dy, y2: y + dy, stroke: s.color, strokeWidth: 2.5, opacity: .55 }));
        kids.push(h("circle", { cx: X(a), cy: y + dy, r: 3.5, fill: "var(--color-hz-surface)", stroke: s.color, strokeWidth: 1.5 }));
        kids.push(h("circle", { cx: X(b), cy: y + dy, r: 4.5, fill: s.color })); }); });
    return Svg(W, DIMS.length * rowH + 20, kids);
  }

  // stacked horizontal W/T/L per fixture
  function WtlRows({ rows, W = 560 }) {
    const labelW = 150, rh = 22, bx = labelW, bwid = W - labelW - 70, kids = [];
    rows.forEach((r, i) => { const y = i * rh, n = r.w + r.t + r.l; let x = bx;
      kids.push(txt(0, y + rh / 2 - 1, r.label, { fill: "var(--color-hz-fg)", weight: 500 }));
      [[r.w, C.win], [r.t, C.tie], [r.l, C.loss]].forEach(([v, col]) => { const w = bwid * v / n; if (v) kids.push(h("rect", { x, y: y + 4, width: w - 1, height: rh - 9, fill: col, rx: 2 })); x += w; });
      kids.push(txt(bx + bwid + 8, y + rh / 2 - 1, `${r.w}·${r.t}·${r.l}`, { mono: true, size: 11 })); });
    return Svg(W, rows.length * rh, kids);
  }

  // ---------- reusable panels ----------
  function Reduction({ lane, arm = "crisp", title, desc }) {
    const s = lane[arm]; const saved = s.baseTok - s.armTok;
    return h(Panel, { title, desc },
      Big([[fmt(saved), "tokens saved per answer", C.saved], [fmt(s.armTok), "tokens with CRISP"], [pct(-s.tokPct), "vs baseline", C.saved]]),
      h(Bars, { cats: s.perFixture.map(p => ({ label: p.id, sub: SCEN[p.id.slice(0, 2)].split(" ")[0] })), series: [{ name: "Baseline", color: C.base, values: s.perFixture.map(p => p.baseTok) }, { name: "CRISP", color: C.crisp, values: s.perFixture.map(p => p.armTok) }], Hh: 230 }),
      Legend([["Baseline (no system prompt)", C.base], ["CRISP", C.crisp]]));
  }
  function Outcomes({ s, title = "Blind verdicts", desc, color = C.win }) {
    return h(Panel, { title, desc }, h(Donut, { parts: [{ label: "CRISP preferred", v: s.wins, color }, { label: "Tie", v: s.ties, color: C.tie }, { label: "Baseline preferred", v: s.losses, color: C.loss }], center: `${s.wins}/${s.wins + s.ties + s.losses}` }));
  }
  function Facts({ s, title = "Required facts", desc }) {
    const total = s.perFixture.reduce((n, p) => n + p.samples.length, 0);
    return h(Panel, { title, desc }, h(Donut, { parts: [{ label: "Kept", v: s.factsKept, color: C.kept, text: `${s.factsKept.toFixed(0)}%` }, { label: "Lost", v: 100 - s.factsKept, color: C.loss, text: `${(100 - s.factsKept).toFixed(0)}%` }], center: `${s.factsKept.toFixed(0)}%` }),
      h("p", { className: "text-hz-sm text-hz-fg-muted", style: { marginTop: 10, marginBottom: 0 } }, `Baseline itself stated ${s.baseFacts.toFixed(0)}% of required facts; ${total} answers judged.`));
  }
  function Quality({ series, title = "Judge scores, baseline → CRISP", desc, legend }) {
    return h(Panel, { title, desc }, h(Dumbbell, { series }), legend ? Legend(legend) : null);
  }

  // ---------- data section ----------
  function DataSection({ lanes, arms, title }) {
    const [fid, setFid] = R.useState("s2a"); const [si, setSi] = R.useState(0);
    const fx = data.fixtures[fid];
    const cols = arms.map(a => { const lane = lanes[a.lane]; const s = a.arm === "baseline" ? lane.baselineSamples[fid][si] : lane[a.arm].perFixture.find(p => p.id === fid).samples[si]; return { ...a, s }; });
    return h(Panel, { title: title || "Data: every answer, every verdict", desc: "Pick a prompt and a sample. Texts are verbatim model output; verdicts and notes are the blind judge's." },
      h("div", { className: "flex gap-2 items-center", style: { marginBottom: 12, flexWrap: "wrap" } },
        h(SegmentedControl, { "aria-label": "Prompt", size: "sm", value: fid, onValueChange: setFid, options: FIX.map(f => ({ value: f, label: f })) }),
        h(SegmentedControl, { "aria-label": "Sample", size: "sm", value: String(si), onValueChange: v => setSi(+v), options: [0, 1, 2].map(i => ({ value: String(i), label: `sample ${i + 1}` })) }),
        h(Badge, { tone: "neutral", variant: "outline" }, SCEN[fid.slice(0, 2)])),
      h("div", { className: "pre bg-hz-inset rounded-hz-field", style: { maxHeight: 140, marginBottom: 12 } }, fx.prompt),
      h("div", { className: "text-hz-sm text-hz-fg-muted", style: { marginBottom: 12 } }, "Required facts: ", fx.facts.map(f => h(Badge, { key: f.id, tone: "neutral", variant: "soft", size: "sm", className: "mr-1" }, `${f.id} ${f.text.slice(0, 48)}${f.text.length > 48 ? "…" : ""}`))),
      h("div", { className: "data-row" }, ...cols.map(c => h("div", { key: c.label },
        h("div", { className: "sample-head" }, h("span", { className: "kicker", style: { color: c.color } }, c.label), h("span", { className: "font-hz-mono text-hz-fg-muted" }, `${c.s.words} w · ${c.s.tokens} tok`)),
        h("div", { className: "pre bg-hz-inset rounded-hz-field" }, c.s.text),
        c.s.judge ? h("div", { className: "text-hz-sm", style: { marginTop: 8 } },
          h(Badge, { tone: c.s.judge.preferred === "arm" ? "success" : c.s.judge.preferred === "tie" ? "neutral" : "danger", variant: "soft", size: "sm" }, c.s.judge.preferred === "arm" ? "judge preferred this" : c.s.judge.preferred === "tie" ? "tie" : "judge preferred baseline"),
          c.s.judge.factsLost.length ? h(Badge, { tone: "warning", variant: "soft", size: "sm", className: "ml-1" }, `lost ${c.s.judge.factsLost.join(", ")}`) : null,
          h("p", { className: "text-hz-fg-muted", style: { margin: "6px 0 0" } }, c.s.judge.notes)) : null))));
  }

  // ---------- TAB 1: CRISP vs baseline ----------
  function TabBaseline() {
    const s = L.sonnet.crisp, cf = L.sonnet.crispify, g = L.ant.crisp;
    const scen = Object.keys(SCEN).map(k => { const ps = s.perFixture.filter(p => p.id.startsWith(k)); return { k, w: sum(ps.map(p => p.w)), t: sum(ps.map(p => p.t)), l: sum(ps.map(p => p.l)), bt: sum(ps.map(p => p.baseTok)) / ps.length, at: sum(ps.map(p => p.armTok)) / ps.length }; });
    const lost = s.mostLost;
    return h("div", { className: "grid g2", style: { marginTop: 16 } },
      h("div", { className: "span2" }, h(InlineAlert, { tone: "success", title: `CRISP wins ${s.wins} of 30 blind pairings, cuts ${s.tokPct.toFixed(0)}% of tokens, keeps ${s.factsKept.toFixed(0)}% of required facts` },
        h("ul", { className: "why" },
          h("li", null, h("b", null, "Shorter without being worse: "), `relevance ${s.dims.relevance.base} → ${s.dims.relevance.arm}, clarity ${s.dims.clarity.base} → ${s.dims.clarity.arm}, scanability ${s.dims.scanability.base} → ${s.dims.scanability.arm}, conversational ${s.dims.conversational.base} → ${s.dims.conversational.arm}. Correctness holds at ${s.dims.correctness.arm}.`),
          h("li", null, h("b", null, "The cost is bounded and known: "), `completeness ${s.dims.completeness.base} → ${s.dims.completeness.arm}. Every lost fact is listed in the data below; the shipped prompt's keep-list is the fix for the recurring ones.`),
          h("li", null, h("b", null, "The transform is nearly free: "), `crispifying an existing answer keeps ${cf.factsKept.toFixed(0)}% of facts, saves ${cf.tokPct.toFixed(0)}%, and never lost more than ${cf.losses} of 30.`),
          h("li", null, h("b", null, "On an already-terse model it still helps: "), `gpt-6-luna baseline is ${g.baseWords} words; CRISP trims ${g.tokPct.toFixed(0)}% and goes ${g.wins}–${g.ties}–${g.losses} with correctness up (${g.dims.correctness.base} → ${g.dims.correctness.arm}).`)))),
      h("div", { className: "span2" }, h(Reduction, { lane: L.sonnet, title: "Tokens per answer, baseline vs CRISP", desc: `Claude Sonnet 5.5, 10 prompts × 3 samples. Baseline has no system prompt; CRISP uses the 80-word /crisp prompt. Tokens are tiktoken o200k_base estimates.` })),
      h(Outcomes, { s, desc: "Judge (Claude Opus 5.5) sees each CRISP answer next to the matching baseline, order randomized, and picks the one a competent engineer would rather receive." }),
      h(Facts, { s, desc: "Share of each prompt's required facts the CRISP answer states. Lost facts are the price of compression; see which below." }),
      h(Quality, { series: [{ name: "CRISP", color: C.crisp, from: DIMS.map(d => s.dims[d].base), to: DIMS.map(d => s.dims[d].arm) }], desc: "Hollow dot: baseline mean. Filled dot: CRISP mean. 1–5 scale, 30 pairs." }),
      h(Panel, { title: "Verdicts by scenario", desc: "Wins · ties · losses for the CRISP arm, grouped by the five scenario types." },
        h(WtlRows, { rows: scen.map(x => ({ label: SCEN[x.k], w: x.w, t: x.t, l: x.l })) }),
        Legend([["CRISP preferred", C.win], ["Tie", C.tie], ["Baseline preferred", C.loss]])),
      h(Panel, { title: "Direct vs transform", desc: "Two ways to apply CRISP: as the system prompt before answering (direct), or as a rewrite of a finished answer (crispify)." },
        h(Bars, { cats: [{ label: "Tokens" }, { label: "Facts kept %" }, { label: "Wins /30" }], series: [{ name: "Direct", color: C.crisp, values: [s.armTok, s.factsKept, s.wins] }, { name: "Crispify", color: C.crispify, values: [cf.armTok, cf.factsKept, cf.wins] }], Hh: 200, ymax: 720 }),
        Legend([["Direct /crisp", C.crisp], ["Crispify", C.crispify]])),
      h(Panel, { title: "What compression lost", desc: "Required facts the baseline had and the CRISP answer dropped, most frequent first (fixture:fact · times)." },
        h("table", { className: "text-hz-sm", style: { borderCollapse: "collapse" } }, h("tbody", null, ...lost.map(([k, n]) => { const [fid, f] = k.split(":"); const fact = data.fixtures[fid].facts.find(x => x.id === f); return h("tr", { key: k }, h("td", { className: "font-hz-mono", style: { padding: "4px 12px 4px 0", whiteSpace: "nowrap" } }, `${k} · ${n}×`), h("td", { className: "text-hz-fg-muted", style: { padding: "4px 0" } }, fact ? fact.text : "")); })))),
      h("div", { className: "span2" }, h(DataSection, { lanes: { sonnet: L.sonnet }, arms: [{ label: "Baseline", lane: "sonnet", arm: "baseline", color: C.base }, { label: "CRISP (direct)", lane: "sonnet", arm: "crisp", color: C.crisp }, { label: "Crispify", lane: "sonnet", arm: "crispify", color: C.crispify }] })));
  }

  // ---------- TAB 2: CRISP vs STE ----------
  function TabSTE() {
    const s = data.ste; const tb = sum(s.map(r => r.baseTok)), ts = sum(s.map(r => r.steTok)), tc = sum(s.map(r => r.crispTok));
